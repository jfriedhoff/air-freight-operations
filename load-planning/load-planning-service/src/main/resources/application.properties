spring.application.name=load-planning-service
server.port=8081
spring.mvc.problemdetails.enabled=true

spring.profiles.active=db

### JPA
spring.datasource.url=jdbc:postgresql://localhost:5443/load_planning
spring.datasource.username=load_planning
spring.datasource.password=password

# update keeps the data over a restart, also the outbox; it only adds tables and columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

### RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### Exchanges and queues (the tests use their own names)
load-planning.amqp.events-exchange=load-planning.events
load-planning.amqp.messaging-events-exchange=messaging.events
load-planning.amqp.queue=load-planning.messaging-events
load-planning.amqp.dead-letter-exchange=load-planning.dlx
load-planning.amqp.dead-letter-queue=load-planning.dlq

### Policy values: change them here and restart, no new release needed
load-planning.policy.loading-opens-before-departure=12h
load-planning.policy.loading-closes-before-departure=20m
load-planning.policy.lateral-balance-limit=0.10

# one thread per queue: messages must be processed in the order they arrive (do not raise this)
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# a listener that throws gets three retries with backoff, then the message is rejected without requeue and dead-letters
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Outbox: how often the relay looks for events that are not sent yet
load-planning.outbox.delay-ms=1000

### Security: a resource server that accepts Keycloak access tokens meant for this service (the audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/air-freight}
spring.security.oauth2.resourceserver.jwt.audiences=load-planning-service

# Test profile: replaces src/main/resources/application.properties during the tests (it is the same file
# name, and the test resources come first). Same settings, except the database: the tests use their own
# database load_planning_test, so they can never touch the dev data in load_planning. Hibernate creates the
# tables at the start of a test run and drops them at the end.
spring.application.name=load-planning-service
server.port=8081
spring.mvc.problemdetails.enabled=true

spring.profiles.active=db

### JPA
# CI_* variables are set by the GitLab pipeline; without them the local Docker Compose values apply
spring.datasource.url=jdbc:postgresql://${CI_DB_HOST_PORT:localhost:5443}/load_planning_test
spring.datasource.username=load_planning
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

### RabbitMQ
spring.rabbitmq.host=${CI_RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### Policy values
load-planning.policy.loading-opens-before-departure=12h
load-planning.policy.loading-closes-before-departure=20m
load-planning.policy.lateral-balance-limit=0.10

### The tests use their own exchanges and queues, so a Load Planning or Messaging that runs at the same time
### never takes a test message, and a test event never reaches Messaging
load-planning.amqp.events-exchange=load-planning-test.load-planning.events
load-planning.amqp.messaging-events-exchange=load-planning-test.messaging.events
load-planning.amqp.queue=load-planning-test.load-planning.messaging-events
load-planning.amqp.dead-letter-exchange=load-planning-test.load-planning.dlx
load-planning.amqp.dead-letter-queue=load-planning-test.load-planning.dlq

spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Outbox
load-planning.outbox.delay-ms=1000

### Security: a resource server that accepts Keycloak access tokens meant for this service (the audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/air-freight}
spring.security.oauth2.resourceserver.jwt.audiences=load-planning-service

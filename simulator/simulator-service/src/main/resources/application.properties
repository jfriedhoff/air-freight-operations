spring.application.name=simulator-service
server.port=8090
spring.mvc.problemdetails.enabled=true

### RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### The two streams the simulator imitates: Messaging listens on these exchanges
simulator.amqp.network-planning-messages-exchange=network-planning.messages
simulator.amqp.cargo-booking-messages-exchange=cargo-booking.messages

# The simulator is a training tool. Started with --spring.profiles.active=production its endpoints do not exist.

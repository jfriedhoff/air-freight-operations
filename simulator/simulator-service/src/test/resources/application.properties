spring.application.name=simulator-service
spring.mvc.problemdetails.enabled=true

### RabbitMQ
# CI_* variables are set by the CI pipeline; without them the local Docker Compose values apply
spring.rabbitmq.host=${CI_RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### The tests publish on their own exchanges, so a running Messaging service does not get test flights
simulator.amqp.network-planning-messages-exchange=simulator-test.network-planning.messages
simulator.amqp.cargo-booking-messages-exchange=simulator-test.cargo-booking.messages

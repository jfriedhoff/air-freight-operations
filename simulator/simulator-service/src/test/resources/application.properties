spring.application.name=simulator-service
spring.mvc.problemdetails.enabled=true

### RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### The tests publish on their own exchanges, so a running Messaging service does not get test flights
simulator.schedule-exchange=simulator-test.network-planning
simulator.bookings-exchange=simulator-test.cargo-booking

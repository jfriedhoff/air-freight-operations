services:
  app_postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped            # CHANGED: was "always"; stays stopped if you stop it manually
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5443:5432'
    networks:
      - kdg-backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d:ro   # CHANGED: read-only, the container never needs to write here

  app_rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped            # CHANGED: added, the prof's file had no restart policy here
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - "5672:5672" #AMQP
      - "15672:15672" #MGMT
    networks:
      - kdg-backend
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/

  idp_mysql:
    image: mysql:9.7.2
    restart: unless-stopped            # CHANGED: added for consistency
    volumes:
      - ./idp_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    ports:
      - '3307:3306'
    networks:
      - kdg-kc
    healthcheck:                       # CHANGED: added so Keycloak can wait until MySQL is really ready
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped            # CHANGED: added, retries if it still starts too early
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'    # CHANGED: KEYCLOAK_ADMIN is the deprecated name
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'    # CHANGED: idem (KEYCLOAK_ADMIN_PASSWORD)
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp_mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
    command: start-dev --import-realm  # imports keycloak/air-freight-realm.json when the realm does not exist yet
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    depends_on:
      idp_mysql:
        condition: service_healthy     # CHANGED: wait for the healthcheck, not just container start
    networks:
      - kdg-kc

networks:
  kdg-kc:
    name: kdg-kc-network
    driver: bridge
  kdg-backend:
    name: kdg-back-network
    driver: bridge

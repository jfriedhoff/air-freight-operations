spring.application.name=flight-operations-service
server.port=8080
spring.mvc.problemdetails.enabled=true

spring.profiles.active=db

### JPA
spring.datasource.url=jdbc:postgresql://localhost:5443/flight_operations
spring.datasource.username=flight_operations
spring.datasource.password=password

# update keeps the data over a restart, also the outbox; it only adds tables and columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

### RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

### Exchanges and queues (the tests use their own names)
flight-operations.amqp.events-exchange=flight-operations.events
flight-operations.amqp.messaging-events-exchange=messaging.events
flight-operations.amqp.queue=flight-operations.messaging-events
flight-operations.amqp.dead-letter-exchange=flight-operations.dlx
flight-operations.amqp.dead-letter-queue=flight-operations.dlq

### Policy values: change them here and restart, no new release needed
flight-operations.policy.actual-time-tolerance=5m
flight-operations.policy.retention-days=7

# one thread per queue: messages must be processed in the order they arrive (do not raise this)
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# a listener that throws gets three retries with backoff, then the message is rejected without requeue and dead-letters
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Outbox: how often the relay looks for events that are not sent yet
flight-operations.outbox.delay-ms=1000

### Security: a resource server that accepts Keycloak access tokens meant for this service (the audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/air-freight}
spring.security.oauth2.resourceserver.jwt.audiences=flight-operations-service

### Flight planners of the first version: the id is the id of the Keycloak account
flight-operations.planners[0].id=3f6b1c1e-5a0d-4d7e-9c1a-2b7f4e8a1001
flight-operations.planners[0].name=Fien Flightplanner

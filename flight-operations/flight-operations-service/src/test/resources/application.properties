spring.application.name=flight-operations-service
spring.mvc.problemdetails.enabled=true
spring.profiles.active=db

### An own database: tests never touch the data of a running service
# CI_* variables are set by the GitLab pipeline; without them the local Docker Compose values apply
spring.datasource.url=jdbc:postgresql://${CI_DB_HOST_PORT:localhost:5443}/flight_operations_test
spring.datasource.username=flight_operations
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

### RabbitMQ: nothing is read and nothing is published; tests look at the rows in the outbox
spring.rabbitmq.host=${CI_RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
# the relays wait until RabbitMQ confirms every message it took (RabbitTemplate.waitForConfirmsOrDie)
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.auto-startup=false
flight-operations.outbox.relay-enabled=false
flight-operations.outbox.delay-ms=1000
# Own names as well, so the tests do not even declare the exchanges and queues of a running service
flight-operations.amqp.events-exchange=flight-operations-test.flight-operations.events
flight-operations.amqp.messaging-events-exchange=flight-operations-test.messaging.events
flight-operations.amqp.queue=flight-operations-test.flight-operations.messaging-events
flight-operations.amqp.dead-letter-exchange=flight-operations-test.flight-operations.dlx
flight-operations.amqp.dead-letter-queue=flight-operations-test.flight-operations.dlq

flight-operations.policy.actual-time-tolerance=5m
flight-operations.policy.retention-days=7

### Security: a resource server that accepts Keycloak access tokens meant for this service (the audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/air-freight}
spring.security.oauth2.resourceserver.jwt.audiences=flight-operations-service

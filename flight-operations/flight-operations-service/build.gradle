plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.freefair.lombok" version '9.7.0'
    id "info.solidsoft.pitest" version "1.19.0"
}

group = 'be.kdg.airfreight'
version = '0.0.1-SNAPSHOT'
description = 'flight-operations-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    testImplementation 'org.springframework.security:spring-security-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.jmolecules.integrations:jmolecules-starter-ddd:0.33.0'
    testImplementation 'org.jmolecules.integrations:jmolecules-starter-test:0.33.0'
    implementation 'org.jspecify:jspecify:1.0.0'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.4')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-picocontainer'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// Line coverage of the tests. Report: build/reports/jacoco/test/html/index.html
// The pipeline reads the CSV (total) and the XML (covered lines in a merge request)
tasks.named('jacocoTestReport') {
    reports {
        csv.required = true
        xml.required = true
    }
}

// Mutation testing: ./gradlew :flight-operations:flight-operations-service:pitest
// Report: build/reports/pitest/index.html. Explanation: docs/mutation-testing-pit.md
pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['be.kdg.airfreight.flightoperations.domain.*']
    targetTests = ['be.kdg.airfreight.flightoperations.acceptance.UnitAcceptanceTest',
                   'be.kdg.airfreight.flightoperations.domain.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

def webAppDir = './src/main/resources/static'

tasks.register('cleanWebApp', Delete) {
    group = 'build'
    description = 'Cleans the web app from resources/static'
    delete(webAppDir)
}

tasks.named('clean') {
    dependsOn('cleanWebApp')
}

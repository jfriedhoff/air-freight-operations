plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'base'
}

group = 'be.kdg.airfreight'
version = '0.0.1-SNAPSHOT'
description = 'flight-operations frontend'

tasks.named('build') {
    dependsOn('npm_run_build')
}

// build depends on check, so ./gradlew build also runs the frontend tests
tasks.named('check') {
    dependsOn('npm_run_test')
}

// Fix for Mac users with Homebrew
def file = new File('/opt/homebrew/bin/npm')
if (file.exists()) {
    node {
        npmCommand = file.absolutePath
    }
}

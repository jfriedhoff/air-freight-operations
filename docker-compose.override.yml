# Partner-service mock from the course (05 Voorbeelden). Docker Compose merges this file into
# docker-compose.yml on every command. "name: kdg" was removed so the containers keep their names.
services:
  partner-service:
    # Pinned to the image we tested with: :latest can change under us when the course pushes a new version.
    # To take a newer version: docker pull ksmeyers/partner-service:latest and copy its digest here.
    image: ksmeyers/partner-service@sha256:12c956b018b0c88b26ad2bfe59db18424f038184d047e9196b758e26c5f3826b
    container_name: partner-service
    ports:
      - '8000:8000'
    environment:
      AMQP_URL: 'amqp://user:password@app_rabbitmq:5672/'
      PARTNER_EXCHANGE: 'partner-exchange'
      DEMO_ENABLED: 'true'
    depends_on:
      app_rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kdg-backend

  app_rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # MGMT
    networks:
      - kdg-backend
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  kdg-backend:
    name: kdg-back-network
    driver: bridge

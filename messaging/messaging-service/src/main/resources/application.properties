spring.application.name=messaging-service
# Messaging has no REST API, so there is no web server that keeps the application running; this keeps it
# running while it waits for messages
spring.main.keep-alive=true

spring.profiles.active=db

### JPA
spring.datasource.url=jdbc:postgresql://localhost:5443/messaging
spring.datasource.username=messaging
spring.datasource.password=password

# update keeps the data over a restart, also the inbox and the outboxes; it only adds tables and columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

### RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
# the relays wait until RabbitMQ confirms every message it took (RabbitTemplate.waitForConfirmsOrDie)
spring.rabbitmq.publisher-confirm-type=simple
# one thread per queue: flight events must be processed in the order they arrive (do not raise this)
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# a listener that throws gets three retries with backoff, then the message is rejected without requeue and dead-letters
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Outboxes: how often each relay looks for what is not sent yet (partner messages, events for the other contexts)
messaging.relay.delay-ms=1000
messaging.outbox.delay-ms=1000

### Exchanges and queues (the tests use their own names)
messaging.amqp.network-planning-messages-exchange=network-planning.messages
messaging.amqp.cargo-booking-messages-exchange=cargo-booking.messages
messaging.amqp.flight-operations-events-exchange=flight-operations.events
messaging.amqp.load-planning-events-exchange=load-planning.events
# the events for the other contexts
messaging.amqp.events-exchange=messaging.events
messaging.amqp.partner-messages-exchange=partner-exchange
messaging.amqp.schedule-queue=messaging.schedule
messaging.amqp.bookings-queue=messaging.bookings
messaging.amqp.flights-queue=messaging.flights
messaging.amqp.loads-queue=messaging.loads
messaging.amqp.partners-queue=partners.all
messaging.amqp.dead-letter-exchange=messaging.dlx
messaging.amqp.dead-letter-queue=messaging.dlq

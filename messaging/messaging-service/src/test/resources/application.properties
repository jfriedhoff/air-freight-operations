# Test profile: replaces src/main/resources/application.properties during the tests (it is the same file
# name, and the test resources come first). Same settings, except the database: the tests use their own
# database messaging_test, so they can never touch the dev data in messaging. Hibernate creates the
# tables at the start of a test run and drops them at the end.
spring.application.name=messaging-service

spring.profiles.active=db

### JPA
# CI_* variables are set by the GitLab pipeline; without them the local Docker Compose values apply
spring.datasource.url=jdbc:postgresql://${CI_DB_HOST_PORT:localhost:5443}/messaging_test
spring.datasource.username=messaging
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

### RabbitMQ
spring.rabbitmq.host=${CI_RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
# the relays wait until RabbitMQ confirms every message it took (RabbitTemplate.waitForConfirmsOrDie)
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Outboxes
messaging.relay.delay-ms=1000
messaging.outbox.delay-ms=1000

### The tests use their own exchanges and queues, so a Messaging that runs at the same time never takes a
### test message, and a test event never reaches Load Planning or Flight Operations
messaging.amqp.network-planning-messages-exchange=messaging-test.network-planning.messages
messaging.amqp.cargo-booking-messages-exchange=messaging-test.cargo-booking.messages
messaging.amqp.flight-operations-events-exchange=messaging-test.flight-operations.events
messaging.amqp.load-planning-events-exchange=messaging-test.load-planning.events
messaging.amqp.events-exchange=messaging-test.messaging.events
messaging.amqp.partner-messages-exchange=messaging-test.messaging.partner-messages
messaging.amqp.schedule-queue=messaging-test.messaging.schedule
messaging.amqp.bookings-queue=messaging-test.messaging.bookings
messaging.amqp.flights-queue=messaging-test.messaging.flights
messaging.amqp.loads-queue=messaging-test.messaging.loads
messaging.amqp.partners-queue=messaging-test.partners.all
messaging.amqp.dead-letter-exchange=messaging-test.messaging.dlx
messaging.amqp.dead-letter-queue=messaging-test.messaging.dlq
